name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend CI (API, Types, Lint & Jest Coverage)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      MONGODB_URI: mongodb://localhost:27017/nagarwatch_ci
      REDIS_URL: redis://localhost:6379
      REDIS_TCP_URL: redis://localhost:6379
      CLERK_PUBLISHABLE_KEY: pk_test_placeholder_for_ci
      CLERK_SECRET_KEY: sk_test_placeholder_for_ci
      CLERK_JWT_KEY: placeholder_jwt_key
      CLERK_WEBHOOK_SECRET: whsec_placeholder_for_ci
      GEMINI_API_KEY: placeholder_gemini_api_key
      CLIENT_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies (npm ci)
        working-directory: server
        run: npm ci

      - name: Run backend linter
        working-directory: server
        run: npm run lint

      - name: Verify TypeScript types (tsc --noEmit)
        working-directory: server
        run: npx tsc --noEmit

      - name: Run Jest test suite with coverage threshold
        working-directory: server
        run: npx jest --coverage --runInBand

  frontend:
    name: Frontend CI (Next.js, Types, Lint & Build)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder_for_ci
      CLERK_SECRET_KEY: sk_test_placeholder_for_ci
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /citizen/dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /citizen/dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies (npm ci)
        working-directory: client
        run: npm ci

      - name: Run frontend linter
        working-directory: client
        run: npm run lint

      - name: Verify TypeScript types (tsc --noEmit)
        working-directory: client
        run: npx tsc --noEmit

      - name: Build Next.js production bundle (next build)
        working-directory: client
        run: npm run build
